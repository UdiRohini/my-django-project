
<!DOCTYPE html>
<html>
<head>
    <title>Mobile Store Management</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .form-box, .table-box {
            background: white;
            padding: 25px;
            margin-top: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #00000012;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            margin: 3px;
        }

        .save {
            background: #2563eb;
        }

        .edit {
            background: #e99b15;
        }

        .delete {
            background: #dc2626;
        }

        .cancel {
            background: #64748b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 13px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #1e293b;
            color: white;
        }

        tr:hover {
            background: #f8fafc;
        }

        #message {
            margin-top: 12px;
            font-weight: bold;
        }

        @media(max-width: 650px) {
            body {
                padding: 10px;
            }

            .table-box {
                overflow-x: auto;
            }

            table {
                min-width: 650px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📱 Mobile Store Management</h1>

    <div class="form-box">

        <h2 id="formTitle">Add New Mobile</h2>

        <form id="mobileForm">

            {% csrf_token %}

            <input type="text" id="brand"
                   placeholder="Enter Brand" required>

            <input type="text" id="model_name"
                   placeholder="Enter Model Name" required>

            <input type="number" id="price"
                   placeholder="Enter Price" required>

            <input type="text" id="ram"
                   placeholder="Enter RAM" required>

            <input type="text" id="storage"
                   placeholder="Enter Storage" required>

            <button type="submit" class="save" id="saveBtn">
                Add Mobile
            </button>

            <button type="button" class="cancel"
                    id="cancelBtn" hidden onclick="resetForm()">
                Cancel Edit
            </button>

        </form>

        <p id="message"></p>

    </div>


    <div class="table-box">

        <h2>Available Mobiles</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Brand</th>
                    <th>Model</th>
                    <th>Price</th>
                    <th>RAM</th>
                    <th>Storage</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="mobileTable">
            </tbody>

        </table>

    </div>

</div>


<script>

    const API_URL = "/mobiles/";

    let editId = null;

    const form = document.getElementById("mobileForm");
    const message = document.getElementById("message");


    // GET: Display all mobiles

    async function loadMobiles() {

        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Unable to load mobiles");
            }

            const mobiles = await response.json();

            const table = document.getElementById("mobileTable");

            table.innerHTML = "";

            mobiles.forEach(mobile => {

                const row = document.createElement("tr");

                [
                    mobile.id,
                    mobile.brand,
                    mobile.model_name,
                    mobile.price,
                    mobile.ram,
                    mobile.storage
                ].forEach(value => {

                    const cell = document.createElement("td");
                    cell.textContent = value;
                    row.appendChild(cell);

                });

                const actions = document.createElement("td");

                const editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "edit";
                editButton.addEventListener("click", () => editMobile(mobile));

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete";
                deleteButton.addEventListener("click", () => deleteMobile(mobile.id));

                actions.appendChild(editButton);
                actions.appendChild(deleteButton);

                row.appendChild(actions);

                table.appendChild(row);

            });

        } catch (error) {
            showMessage(error.message, true);
        }
    }


    // POST: Add mobile
    // PUT: Update mobile

    form.addEventListener("submit", async function(event) {

        event.preventDefault();

        const mobileData = {

            brand: document.getElementById("brand").value,

            model_name: document.getElementById("model_name").value,

            price: Number(document.getElementById("price").value),

            ram: document.getElementById("ram").value,

            storage: document.getElementById("storage").value

        };

        const url = editId === null
            ? API_URL
            : API_URL + editId + "/";

        const method = editId === null ? "POST" : "PUT";

        try {

            const response = await fetch(url, {

                method: method,

                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": document.querySelector(
                        "[name=csrfmiddlewaretoken]"
                    ).value
                },

                body: JSON.stringify(mobileData)

            });

            const result = await response.json();

            if (!response.ok) {
                showMessage(JSON.stringify(result), true);
                return;
            }

            showMessage(
                editId === null
                    ? "Mobile added successfully!"
                    : "Mobile updated successfully!"
            );

            resetForm();

            loadMobiles();

        } catch (error) {

            showMessage(error.message, true);

        }

    });


    // Load existing details into form for editing

    function editMobile(mobile) {

        editId = mobile.id;

        document.getElementById("brand").value = mobile.brand;

        document.getElementById("model_name").value = mobile.model_name;

        document.getElementById("price").value = mobile.price;

        document.getElementById("ram").value = mobile.ram;

        document.getElementById("storage").value = mobile.storage;

        document.getElementById("formTitle").textContent = "Update Mobile";

        document.getElementById("saveBtn").textContent = "Update Mobile";

        document.getElementById("cancelBtn").hidden = false;

        window.scrollTo({top: 0, behavior: "smooth"});

    }


    // DELETE: Delete particular mobile

    async function deleteMobile(id) {

        if (!confirm("Are you sure you want to delete this mobile?")) {
            return;
        }

        try {

            const response = await fetch(API_URL + id + "/", {

                method: "DELETE",

                headers: {
                    "X-CSRFToken": document.querySelector(
                        "[name=csrfmiddlewaretoken]"
                    ).value
                }

            });

            if (!response.ok) {
                throw new Error("Delete failed");
            }

            showMessage("Mobile deleted successfully!");

            loadMobiles();

        } catch (error) {

            showMessage(error.message, true);

        }

    }


    // Reset form

    function resetForm() {

        form.reset();

        editId = null;

        document.getElementById("formTitle").textContent = "Add New Mobile";

        document.getElementById("saveBtn").textContent = "Add Mobile";

        document.getElementById("cancelBtn").hidden = true;

    }


    function showMessage(text, isError = false) {

        message.textContent = text;

        message.style.color = isError ? "red" : "green";

    }


    // Initially load all mobiles

    loadMobiles();

</script>

</body>
</html>
